id: scf
version: 1.0.0
title: 供应链金融（最小先验包）
competencyQuestions:
  - id: cq.confirm
    text: 确权对应哪些字段与单据状态？
  - id: cq.finance_balance
    text: 融资余额如何计算？
  - id: cq.roles
    text: 核心企业与供应商分别是什么角色？
domains:
  - id: asset
    name: 资产
    summary: 应收账款等可融资资产
  - id: confirm
    name: 确权
    summary: 核心企业对资产的确认
  - id: finance
    name: 融资
    summary: 融资申请、审批与放款
concepts:
  - id: receivable
    preferred: 应收账款
    aliases: [应收、AR]
    domain: asset
    definition: 供应商对核心企业的未收账款债权
  - id: confirm_right
    preferred: 确权
    aliases: [确认债权、资产确权]
    domain: confirm
    definition: 核心企业确认应付责任的动作或状态
  - id: finance_balance
    preferred: 融资余额
    aliases: [在贷余额]
    domain: finance
    definition: 已放款且未结清的融资金额合计
documentTypes:
  - id: receivable_doc
    name: 应收单据
    domain: asset
    states: [草稿, 已准入, 已确权, 已融资, 已结清]
  - id: confirm_doc
    name: 确权单
    domain: confirm
    states: [待确权, 已确权, 已拒绝]
  - id: finance_app
    name: 融资申请单
    domain: finance
    states: [已提交, 审批中, 已放款, 已拒绝]
processes:
  - id: finance_main
    name: 融资主流程
    steps:
      - { activity: 资产准入, seq: 1, documentType: receivable_doc }
      - { activity: 确权, seq: 2, documentType: confirm_doc, role: 核心企业 }
      - { activity: 融资申请, seq: 3, documentType: finance_app }
      - { activity: 放款, seq: 4 }
      - { activity: 还款结清, seq: 5 }
roles:
  - { id: supplier, name: 供应商 }
  - { id: core_enterprise, name: 核心企业 }
  - { id: funder, name: 资金方 }
events:
  - { id: confirmed, name: 确权完成 }
  - { id: disbursed, name: 放款成功 }
hints:
  - { conceptId: confirm_right, columnRegex: "(?i)confirm|确权" }
  - { conceptId: finance_balance, columnRegex: "(?i)balance|余额|financing" }
  - { conceptId: receivable, tableRegex: "(?i)recv|receivable|asset|应收" }
